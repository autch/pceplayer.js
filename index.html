<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <title>P/ECE 曲データプレイヤー</title>
    <meta name="description" content="P/ECE の標準音楽ドライバ用の曲データ (pmd) をブラウザで再生します">
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+1p:wght@400;700&display=swap">
    <style>
        :root {
            --page: #d6d8dc;
            --text: #22252a;
            --muted: #5e636b;
            --link: #2b5d9a;
            color-scheme: light dark;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page: #2a2c30;
                --text: #e4e5e8;
                --muted: #a3a7ae;
                --link: #8db8ec;
            }
        }
        body {
            margin: 0;
            background: var(--page);
            color: var(--text);
            font-family: 'M PLUS 1p', system-ui, sans-serif;
            line-height: 1.6;
        }
        main {
            max-width: 1120px;
            margin: 0 auto;
            padding: clamp(1.25rem, 4vw, 3rem) 16px 2rem;
        }
        header { margin-bottom: clamp(1.5rem, 4vw, 2.5rem); }
        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3.2vw, 2.1rem);
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        header p {
            margin: 0.4rem 0 0;
            max-width: 40em;
            color: var(--muted);
        }
        footer {
            max-width: 1120px;
            margin: 0 auto;
            padding: 2rem 16px 3rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        footer p { margin: 0.3rem 0; max-width: 60em; }
        a { color: var(--link); }
    </style>
    <script type="module" src="./src/main.ts"></script>
</head>
<body>
    <main>
        <header>
            <h1>P/ECE 曲データプレイヤー</h1>
            <p>P/ECE の標準音楽ドライバ用の曲データ (pmd) を、実機と同じ音源ドライバで再生します。一覧から曲を選んでください。</p>
        </header>
        <pmd-playlist src="./list.json" layout="full"></pmd-playlist>
    </main>
    <footer>
        <p>音源ドライバは P/ECE 標準音楽ライブラリ muslib (Copyright (C)2001 AQUAPLUS Co., Ltd. / OeRSTED, Inc.) を改変したものです。アクアプラスはこのプログラムに関与しておらず、その内容と実行結果について責任を負いません。</p>
        <p>曲データの著作権はそれぞれの作者にあります。</p>
    </footer>
</body>
</html>
